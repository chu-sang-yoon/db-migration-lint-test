name: db-migration-lint

# DB 마이그레이션 안전 린트 (squawk)
# - 8/4 이벤트서비스 hang 재발 방지: 위험 DDL(풀 락·파괴적 변경)을 머지 전에 차단
# - 룰 설정: 저장소 루트 .squawk.toml (pg_version, excluded_rules)
# - 우회: PR에 `db-lint-bypass` 라벨 (사람 검토 완료 전제, 기록 남음)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: db-migration-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  db-migration-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 우회 라벨 확인
        id: bypass
        env:
          HAS_BYPASS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'db-lint-bypass') }}
        run: |
          if [ "$HAS_BYPASS_LABEL" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::db-lint-bypass 라벨로 DB 마이그레이션 린트를 우회했습니다 — 사람 검토 완료 전제, 우회 이력은 라벨 검색으로 추적됩니다"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.bypass.outputs.skip != 'true'

      - name: 변경된 마이그레이션 추출
        id: diff
        if: steps.bypass.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '.[] | select(.status != "removed") | .filename' \
            | grep -E '^src/main/resources/db/migration/.*\.sql$' | tr '\n' ' ' || true)
          echo "files=${files}" >> "$GITHUB_OUTPUT"
          echo "검사 대상: ${files:-없음 — 통과}"

      - name: squawk 설치
        if: steps.bypass.outputs.skip != 'true' && steps.diff.outputs.files != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: squawk-cli 설치
        if: steps.bypass.outputs.skip != 'true' && steps.diff.outputs.files != ''
        run: npm install -g squawk-cli@2.62.0

      - name: squawk 게이트 판정
        if: steps.bypass.outputs.skip != 'true' && steps.diff.outputs.files != ''
        env:
          FILES: ${{ steps.diff.outputs.files }}
        run: |
          read -ra FILES_ARRAY <<< "$FILES"
          squawk --verbose "${FILES_ARRAY[@]}"

      - name: squawk PR 코멘트
        if: >-
          steps.bypass.outputs.skip != 'true' && steps.diff.outputs.files != ''
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SQUAWK_GITHUB_TOKEN: ${{ github.token }}
          SQUAWK_GITHUB_API_URL: ${{ github.api_url }}
          SQUAWK_GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          SQUAWK_GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          SQUAWK_GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          FILES: ${{ steps.diff.outputs.files }}
        run: |
          read -ra FILES_ARRAY <<< "$FILES"
          squawk upload-to-github "${FILES_ARRAY[@]}"
